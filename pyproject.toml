[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-git-cli-apurva"
version = "0.1.0"
description = "AI-powered Git CLI — auto commit messages, README, gitignore"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "langchain-groq",
    "python-dotenv",
]

[project.scripts]
ai_git = "main:main"